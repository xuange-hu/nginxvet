[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nginxvet"
version = "0.1.0"
description = "Zero-dependency, evidence-first nginx configuration security auditor: three passes, add_header inheritance traps, effective-header resolution and SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Dependency-free on purpose: config audits must run on the machine that holds
# the config, including minimal images where pip cannot reach an index.
dependencies = []
keywords = [
  "security",
  "nginx",
  "audit",
  "static-analysis",
  "add-header",
  "hsts",
  "csp",
  "sarif",
  "devsecops",
  "linter",
  "zero-dependency",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP and moved its import path; this server targets 1.x.
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/nginxvet"
Repository = "https://github.com/xuange-hu/nginxvet"
Issues = "https://github.com/xuange-hu/nginxvet/issues"

[project.scripts]
nginxvet = "nginxvet.cli:main"
nginxvet-mcp = "nginxvet.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nginxvet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Rule prose is documentation; splitting it at column 120 hurts readability.
"src/nginxvet/rules.py" = ["E501"]
# sys.path is injected above the import so a bare clone can run the tests.
"tests/test_mcp_server.py" = ["E402"]
